name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate content JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          assets = Path("app/src/main/assets")
          parts_doc = json.loads((assets / "parts.json").read_text(encoding="utf-8"))
          part_ids = {p["id"] for p in parts_doc["parts"]}

          errors = []
          for recipe_path in sorted((assets / "recipes").glob("*.json")):
              recipe = json.loads(recipe_path.read_text(encoding="utf-8"))
              for key in ("previewParts", "printParts"):
                  for part_id in recipe.get(key, []):
                      if part_id not in part_ids:
                          errors.append(f"{recipe_path.name}: unknown {key} part {part_id}")
              for step in recipe.get("steps", []):
                  for key in ("input", "output"):
                      part_id = step.get(key)
                      if part_id and part_id not in part_ids:
                          errors.append(f"{recipe_path.name}: step {step.get('id')} unknown {key} {part_id}")
                  for part_id in step.get("dishAfter", []):
                      if part_id not in part_ids:
                          errors.append(f"{recipe_path.name}: step {step.get('id')} unknown dishAfter part {part_id}")

          if errors:
              raise SystemExit("\n".join(errors))
          print("Content JSON validation passed")
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FoodMaker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
